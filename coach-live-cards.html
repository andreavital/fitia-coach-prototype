<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fitia Coach · alert home</title>
<style>
:root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","SF Pro","Helvetica Neue",system-ui,Arial,sans-serif;
    --ink:#000; --ink2:#4e4e46; --ink3:#757575; --line:#e1e1e1;
    --card-border:#ce8fe6;
    --btn:linear-gradient(93.8deg,rgba(206,143,230,.36) 2.34%,rgba(133,176,223,.36) 52.82%,rgba(49,193,225,.36) 99.54%);
    --card-bg:linear-gradient(180deg,rgba(206,143,230,.05) 0%,rgba(251,66,152,.03) 48.56%,rgba(49,193,225,.05) 100%);
    --green:#2f9e57; --greenbg:#eaf6ee; --amber:#BB6B02; --amberbg:#fdf3e3;
    --red:#c0392b; --redbg:#fbeceb;
    --e:cubic-bezier(.165,.84,.44,1); --eio:cubic-bezier(.65,0,.35,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--sf);background:#e9e9ec;color:var(--ink);-webkit-font-smoothing:antialiased;
    display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;justify-content:center;padding:26px 16px 56px}
  .colA{width:393px} .colB{width:420px}
  .lead{font-size:13px;color:#8a8a8f;margin-bottom:12px;text-align:center;line-height:1.45}

  /* ---------- device ---------- */
  .phone{width:393px;height:852px;background:#fff;border-radius:44px;overflow:hidden;position:relative;
    box-shadow:0 24px 60px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column}
  .aura{position:absolute;left:-40px;bottom:120px;width:430px;height:430px;pointer-events:none;z-index:0;
    opacity:.084;filter:blur(60px);transition:opacity .45s var(--e);
    background:radial-gradient(circle at 50% 50%,#ce8fe6 0%,#fb4298 40%,#31c1e1 75%,transparent 78%)}

  .status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 21px 0 21px;position:relative;z-index:3}
  .status .t{font-size:16px;font-weight:600;letter-spacing:-.31px}
  .status .r{display:flex;gap:5px;align-items:center}

  .hdr{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;position:relative;z-index:3}
  .hdr .ttl{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:600;
    letter-spacing:-.31px;line-height:20px;pointer-events:none}
  .gbtn{width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.65);
    box-shadow:0 8px 40px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;
    border:0;color:#000;cursor:pointer;font-family:var(--sf);position:relative;z-index:3;
    transition:transform .12s var(--e)}
  .gbtn:active{transform:scale(.92)}
  .gbtn:focus-visible{outline:2px solid #000;outline-offset:2px}

  .body{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;z-index:2;overflow:hidden}
  .body.chat{justify-content:flex-start;overflow-y:auto;padding:8px 18px;gap:12px;align-items:stretch}
  .body.chat::-webkit-scrollbar{display:none}

  /* ---------- coach mark + title ---------- */
  .head-block{display:flex;flex-direction:column;align-items:center;gap:20px}
  .ai{width:50px;height:50px;display:flex;align-items:center;justify-content:center}
  .ai svg{display:block;width:50px;height:50px}
  .ttlgrp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .lbl{font-size:15px;font-weight:400;line-height:20px;letter-spacing:-.23px;color:var(--ink3)}
  .h1{font-size:26px;font-weight:600;line-height:32px;letter-spacing:.22px;color:#000}
  .sub{font-size:15px;font-weight:400;line-height:20px;letter-spacing:-.23px;color:var(--ink3);
    max-width:310px;text-align:center}

  /* ---------- carousel ---------- */
  .rail{width:393px;margin-top:36px;display:flex;align-items:stretch;gap:16px;overflow-x:auto;padding:2px 36px 8px;
    scroll-snap-type:x mandatory;scroll-behavior:smooth;cursor:grab;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
  .rail.dragging .card{pointer-events:none}

  .card{flex:0 0 321px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;
    gap:20px;border-radius:32px;border:.5px solid var(--card-border);background:var(--card-bg);
    padding:18px 18px 16px 16px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:border-color .4s var(--e),background .4s var(--e)}
  /* severity tint — preventive keeps the Coach gradient, nothing is wrong yet */
  /* mild: the border carries the state, the surface stays clean */
  .card.s-low,.card.s-high{border-color:#e0b877;background:rgba(255,255,255,.2)}
  .card.s-tooLow,.card.s-tooHigh{border-color:#dd9a93;
    background:linear-gradient(180deg,rgba(224,110,98,.035) 0%,rgba(224,110,98,.012) 100%)}
  .card.s-onTrack,.card.resolved{border-color:#7fc79b;
    background:linear-gradient(180deg,rgba(47,158,87,.06) 0%,rgba(47,158,87,.02) 100%)}
  /* the CTA stays the Coach gradient in every state: a red or amber button reads
     as destructive or as a warning, and this action is always constructive.
     On track is the exception: green here means achieved, not dangerous. */
  /* resolved cards keep the same height: the action slot becomes a closing mark */
  .cdone{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 20px;border-radius:50px;background:rgba(47,158,87,.1);
    font-size:16px;font-weight:600;line-height:20px;letter-spacing:-.31px;color:#2f9e57}
  .cdone svg{flex:0 0 auto}
  .card.s-onTrack .cta,.card.resolved .cta{
    background:linear-gradient(93.8deg,rgba(47,158,87,.24) 0%,rgba(120,200,150,.22) 55%,rgba(49,193,225,.18) 100%)}
  .cin{flex:1;display:flex;flex-direction:column;gap:12px;width:100%}
  .crow{display:flex;align-items:center;gap:6px;width:100%;overflow:hidden}
  .cic{width:24px;height:24px;flex:0 0 24px;border-radius:7.5px;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .cic img{width:24px;height:24px;object-fit:cover;display:block}
  .ct{font-size:16px;font-weight:600;line-height:20px;letter-spacing:-.31px;color:#000;white-space:nowrap}
  .tag{margin-left:auto;font-size:12px;font-weight:600;line-height:16px;padding:3px 9px;border-radius:999px;
    white-space:nowrap;transition:background .3s var(--e),color .3s var(--e)}
  .tag.high,.tag.low{background:var(--amberbg);color:var(--amber)}
  .tag.tooHigh,.tag.tooLow{background:var(--redbg);color:var(--red)}
  .tag.onTrack{background:var(--greenbg);color:var(--green)}
  .cbody{display:flex;flex-direction:column;gap:12px;padding:0 4px;width:100%}
  .cb{font-size:14px;font-weight:400;line-height:18px;letter-spacing:-.15px;color:var(--ink2)}
  .cb b{font-weight:600;color:#000}
  .hr{height:1px;width:100%;background:var(--line)}
  .cf{font-size:14px;font-weight:400;line-height:18px;letter-spacing:-.15px;color:var(--ink2)}
  .ctarow{display:flex;justify-content:center;padding:0 2px;width:100%;margin-top:auto}
  .cta{flex:1;min-width:70px;padding:10px 20px;border-radius:50px;background:var(--btn);border:0;
    font-family:var(--sf);font-size:16px;font-weight:600;line-height:20px;letter-spacing:-.31px;color:#000;
    cursor:pointer;transition:transform .12s var(--e),filter .3s var(--e)}
  .cta:active{transform:scale(.985)}
  .cta:focus-visible{outline:2px solid #000;outline-offset:2px}
  .flash{animation:flash .7s var(--e)}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(206,143,230,.5)}100%{box-shadow:0 0 0 16px rgba(206,143,230,0)}}

  .dots{display:flex;gap:9px;justify-content:center;margin-top:26px;min-height:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#d9d9d9;border:0;padding:0;cursor:pointer;
    transition:background .3s var(--e)}
  .dot.on{background:#3d3b30}
  .dot:focus-visible{outline:2px solid #000;outline-offset:3px}

  /* ---------- empty / pills ---------- */
  .pills{display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:24px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.5);
    border:1px solid #fff;border-radius:24px;padding:12px 16px;font-family:var(--sf);
    font-size:14px;font-weight:600;line-height:18px;letter-spacing:-.15px;color:#000;cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,.06);transition:transform .12s var(--e)}
  .pill:active{transform:scale(.97)}
  .pill:focus-visible{outline:2px solid #000;outline-offset:2px}
  .pill svg{color:#8c8876}
  .footnote{display:flex;gap:11px;align-items:flex-start;background:rgba(247,247,247,.9);
    border-radius:24px;padding:14px 16px;margin:30px 22px 0;max-width:330px}
  .footnote svg{flex:0 0 auto;margin-top:1px;color:#aFaFaF}
  .footnote p{font-size:14px;font-weight:400;line-height:18px;letter-spacing:-.15px;color:var(--ink2)}

  /* ---------- chat ---------- */
  .bubble{background:rgba(247,247,247,.95);border-radius:20px;padding:14px 16px;align-self:flex-start;max-width:96%}
  .bt{font-size:15px;font-weight:400;line-height:22px;letter-spacing:-.23px;color:#000}
  .bt b{font-weight:600}
  .me{align-self:flex-end;background:rgba(238,243,253,.9);max-width:80%}
  .enter{animation:rise .26s var(--e) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .typing{display:flex;gap:5px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#afafaf;animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .bmeta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .av{width:26px;height:26px;border-radius:50%;background:rgba(238,243,253,.9);
    display:flex;align-items:center;justify-content:center;flex:0 0 26px}
  .av i{width:16px;height:16px;border-radius:50%;
    background:conic-gradient(from 200deg,#8fd3e8,#c9a8e0,#fbc2d4,#8fd3e8);filter:blur(1.5px)}
  .nm{font-size:13px;font-weight:600}
  .ctxcard{border-radius:24px;border:.5px solid var(--card-border);background:var(--card-bg);padding:14px 16px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .ctxcard.s-low,.ctxcard.s-high{border-color:#e0b877;background:rgba(255,255,255,.2)}
  .ctxcard.s-tooLow,.ctxcard.s-tooHigh{border-color:#dd9a93;
    background:linear-gradient(180deg,rgba(224,110,98,.035),rgba(224,110,98,.012))}
  .ctxcard.s-onTrack{border-color:#7fc79b;
    background:linear-gradient(180deg,rgba(47,158,87,.06),rgba(47,158,87,.02))}
  .food{display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.75);border-radius:16px;
    padding:11px 12px;margin-top:8px;border:1px solid rgba(255,255,255,.9)}
  .fn{font-size:14px;font-weight:600;line-height:18px;letter-spacing:-.15px}
  .fv{font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:1px}
  .fadd{margin-left:auto;padding:8px 14px;border-radius:50px;background:var(--btn);color:#000;
    font-size:13px;font-weight:600;font-family:var(--sf);border:0;cursor:pointer}
  .fadd.added{background:var(--greenbg);color:var(--green)}

  /* ---------- suggestions + input + tabs ---------- */
  .footer{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;padding:50px 18px 0}
  .sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .sugg::-webkit-scrollbar{display:none}
  .sugg button{flex:0 0 auto;white-space:nowrap;background:rgba(255,255,255,.5);border:1px solid #fff;
    border-radius:24px;padding:12px 16px;font-family:var(--sf);font-size:14px;font-weight:600;
    line-height:18px;letter-spacing:-.15px;color:#000;cursor:pointer;user-select:none;
    box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .msginput{height:70px;background:rgba(255,255,255,.6);border:1px solid #fff;border-radius:24px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);display:flex;align-items:flex-end;padding:18px}
  .msginput .ph{flex:1;font-size:16px;font-weight:400;line-height:22px;letter-spacing:-.31px;color:#757575}
  .msginput .btns{display:flex;gap:8px;align-items:center}
  .msginput .photo{width:22px;height:22px;color:#3d3b30}
  .msginput .send{width:34px;height:34px;border-radius:50%;background:#ededed;
    display:flex;align-items:center;justify-content:center;color:#afafaf}

  .tabs{position:relative;z-index:2;display:flex;gap:16px;align-items:flex-start;justify-content:flex-end;
    padding:16px 25px 25px;backdrop-filter:blur(30px);
    background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.7) 33%)}
  .tabgrp{flex:1;display:flex;background:#f7f7f7;border-radius:296px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:6px 8px 7px;border-radius:100px;color:#000}
  .tab.on{background:#ededed}
  .tab span{font-size:10px;font-weight:510;line-height:12px;letter-spacing:-.1px}
  .tab.on span{font-weight:600}
  .tabsolo.on{background:#ededed}
  .tabsolo{position:relative}
  .tabsolo.badge::after{content:'';position:absolute;top:7px;right:9px;width:10px;height:10px;
    border-radius:50%;background:#e5484d;border:2px solid #fff;
    box-shadow:0 1px 4px rgba(229,72,77,.45);animation:pop .32s var(--e) both}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .tabsolo{width:54px;height:54px;border-radius:296px;background:#f7f7f7;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .tabsolo span{font-size:10px;font-weight:600;line-height:12px;letter-spacing:-.1px}

  .toast{position:absolute;left:18px;right:18px;bottom:230px;background:rgba(28,28,30,.94);color:#fff;
    border-radius:20px;padding:13px 16px;font-size:14.5px;line-height:1.4;opacity:0;transform:translateY(10px);
    transition:opacity .25s var(--e),transform .25s var(--e);pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:none}

  /* ---------- Plan tab (inside the device) ---------- */
  .planview{flex:1 1 auto;position:relative;z-index:2;overflow:hidden;display:flex;background:#fff}
  .planview[hidden]{display:none}
  .phone.plain .aura{opacity:0}
  .pv-scroll{flex:1;overflow-y:auto;padding:4px 20px 16px;scrollbar-width:none}
  .pv-scroll::-webkit-scrollbar{display:none}
  .pv-h1{font-size:26px;font-weight:600;line-height:32px;letter-spacing:.22px;margin-bottom:14px}
  .band{display:flex;gap:8px;margin:18px 0 4px}
  .band button{flex:1;font-family:var(--sf);font-size:14px;font-weight:600;border:0;border-radius:14px;
    padding:13px 8px;cursor:pointer;background:#f2f2f4;color:#000}
  .band button:active{background:#e7e7ea}

  /* ---------- control panel ---------- */
  .panel{background:#fff;border:1px solid #dededf;border-radius:22px;padding:18px}
  .panel h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .band{display:flex;gap:8px;margin:14px 0}
  .band button{flex:1;font-family:var(--sf);font-size:13px;font-weight:600;border:0;border-radius:12px;
    padding:11px 8px;cursor:pointer;background:#f0f0f2;color:#000}
  .band button.primary{background:#1d1d1f;color:#fff}
  .sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a1a1a6;margin:16px 0 8px}
  .slid{margin-bottom:12px}
  .sl-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
  .sl-name{font-weight:600}
  .sl-val{margin-left:auto;color:#6e6e73;font-variant-numeric:tabular-nums}
  .sl-state{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
  input[type=range]{width:100%;margin-top:7px;accent-color:#a07ec4}
  .gates{margin-top:12px;display:flex;flex-direction:column;gap:7px}
  .gate{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.35}
  .gate i{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:4px}
  .gate.ok i{background:#2f9e57} .gate.no i{background:#c0392b}
  .gate b{font-weight:600;display:block} .gate span{color:#a1a1a6;display:block;margin-top:1px}
  .legend{font-size:12px;color:#a1a1a6;line-height:1.5;margin-top:10px}
  .kpi{display:flex;gap:8px;margin-top:12px}
  .kpi div{flex:1;background:#f7f7f9;border-radius:12px;padding:9px 10px}
  .kpi .kn{font-size:11px;color:#6e6e73;font-weight:600}
  .kpi .kv{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  @media(prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}

  /* ---------- real phone: full screen, no simulated chrome ---------- */
  @media (max-width:520px){
    html,body{height:100%;overflow:hidden}
    body{padding:0;margin:0;background:#fff;display:block}
    .colA{width:100%;height:100%;margin:0}
    .phone{width:100%;height:100vh;height:100dvh;   /* vh first as a fallback */
      max-height:none;border-radius:0;box-shadow:none;border:0}
    .status{display:none}                          /* the OS already draws it */
    .hdr{flex:0 0 auto;min-height:50px;padding-top:calc(env(safe-area-inset-top) + 4px)}
    .body{flex:1 1 auto;justify-content:center}    /* the alert block stays centred */
    .footer{padding-top:0}                         /* the body absorbs the slack instead */
    .tabs{padding:12px 25px calc(10px + env(safe-area-inset-bottom))}
    .toast{bottom:calc(200px + env(safe-area-inset-bottom))}
  }

</style>
</head>
<body>



<div class="colA">
<div class="phone">
  <div class="aura"></div>

  <div class="status">
    <span class="t">9:41</span>
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.2C5.3 2.2 2.9 3.3 1.1 5l1.3 1.3C3.9 4.9 5.8 4 8 4s4.1.9 5.6 2.3L15 5C13.1 3.3 10.7 2.2 8 2.2z"/><circle cx="8" cy="8.9" r="1.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c.8-.3 1.3-1 1.3-2S23.8 4.3 23 4z" fill="currentColor" fill-opacity=".35"/></svg>
    </span>
  </div>

  <div class="hdr">
    <button class="gbtn" id="menuBtn" aria-label="Open history">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1h12M1 6h12M1 11h8"/></svg></button>
    <div class="ttl">Fitia Coach</div>
    <button class="gbtn" id="newBtn" aria-label="New chat">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.1 1.9a1.7 1.7 0 012.4 2.4L6.6 13.2l-3.2.8.8-3.2z"/><path d="M11.6 3.4l2.4 2.4"/></svg></button>
  </div>

  <div class="body" id="body"></div>
  <div class="planview" id="plan" hidden>
    <div class="pv-scroll">
      <div class="pv-h1">Today</div>
      <div class="kpi"><div><div class="kn">Alerts sent today</div><div class="kv" id="kSent"></div></div></div>
      <div class="sec">Calories logged · gates every alert</div>
      <div class="slid">
        <div class="sl-top"><span class="sl-name">Calories</span><span class="sl-val" id="vcal"></span></div>
        <input type="range" id="cal" min="0" max="2400" step="25">
        <div class="gates" id="gates"></div>
      </div>
      <div class="sec">Nutrients</div>
      <div id="sliders"></div>
      <div class="legend" id="legend"></div>
      <div class="band">
        <button id="delBtn">Delete a food</button>
        <button id="resetBtn">New day</button>
      </div>
    </div>

/* ---------------- config, per Intraday V4 §3–5 ---------------- */
const CONFIG={typeAThreshold:.75,typeACalCeiling:1,typeBMinCalRatio:.5,typeBMinCalRoom:150,typeBProjectionThreshold:.7};
const CAPS={maxPerNutrientPerDay:1,maxAlertsPerDay:5};
const CAL_TARGET=1800, CAL_RANGE_TOP=2000;

const N=[
 {key:'transFat',pair:'something cooked at home instead of packaged',  rank:1,label:'Trans Fat',  unit:'g', type:'A',limit:2,   max:5,   step:.1, v:0.4},
 {key:'sodium',pair:'something cooked from scratch or a side without sauce',    rank:2,label:'Sodium',     unit:'mg',type:'A',limit:2300,max:4000,step:25, v:2000},
 {key:'addedSugar',pair:'fruit or something savoury',rank:3,label:'Added Sugar',unit:'g', type:'A',limit:50,  max:100, step:1,  v:18},
 {key:'satFat',pair:'lean protein or something grilled',    rank:4,label:'Sat Fat',    unit:'g', type:'A',limit:20,  max:45,  step:.5, v:7},
 {key:'protein',pair:'eggs or a cup of Greek yogurt',   rank:5,label:'Protein',    unit:'g', type:'B',limit:120, max:180, step:1,  v:44},
 {key:'fiber',pair:'a bowl of berries or a plate of vegetables',     rank:6,label:'Fiber',      unit:'g', type:'B',limit:30,  max:60,  step:1,  v:8}
];
const byKey=Object.fromEntries(N.map(n=>[n.key,n]));

/* the ONLY thing persisted: which nutrients have triggered today */
let dayState={triggeredToday:{},seenToday:{},sentTodayByNutrient:{},totalSentToday:0};
/* seenToday: the user actually opened Coach while this alert was still open.
   Without it, a resolved card would tell the ending of a story they never read. */
let tab='coach', unseen=false;
let lastMeal='lunch';   // in production: the most recent meal the user logged
let cal=1100, view='home', chatKey=null;

/* ---------------- derivation ---------------- */
const calRatio=()=>cal/CAL_TARGET;
const calRoom =()=>CAL_RANGE_TOP-cal;
const ratio=n=>n.v/n.limit;
const projected=n=>calRatio()>.05 ? ratio(n)/Math.min(calRatio(),1) : 1;

function qualifies(n){
  if(n.type==='A') return ratio(n)>=CONFIG.typeAThreshold && calRatio()<CONFIG.typeACalCeiling;
  if(calRatio()<CONFIG.typeBMinCalRatio) return false;
  if(calRoom()<CONFIG.typeBMinCalRoom)   return false;
  return projected(n)<CONFIG.typeBProjectionThreshold;
}

/* card state derives from the nutrient's own condition right now,
   independent of the gating rules that decide whether a push fires */
/* State = how much has been eaten. Limit nutrients have no low side:
   under the limit they are simply on track, and the card is preventive
   (no indicator) until the limit is actually crossed. */
const CUTS={ lowHard:.50, lowSoft:.90, overHard:1.25 };
function stateOf(n){
  const r=ratio(n);
  if(n.type==='A'){
    if(r>=CUTS.overHard) return 'tooHigh';   // heavy overconsumption
    if(r>=1)             return 'high';      // slight overconsumption
    return 'preventive';                     // still under: warn, don't label
  }
  if(r<CUTS.lowHard) return 'tooLow';
  if(r<CUTS.lowSoft) return 'low';
  return 'onTrack';
}
const STATE_LABEL={onTrack:'On track',low:'Low',tooLow:'Too low',high:'High',tooHigh:'Too high'};
const fmt=(x,u)=>{const s=Math.round(x*10)/10;return (Number.isInteger(s)?s:s.toFixed(1)).toLocaleString('en-US')+u;};

const COPY={
 preventive:n=>({tag:null,title:`Watch your ${n.label.toLowerCase()}`,
   body:`You have <b>${fmt(n.limit-n.v,n.unit)}</b> of room left before your limit. Keeping your next meal simple should be enough — want ideas?`,
   cta:'How to stay under it'}),
 high:n=>({tag:STATE_LABEL.high,title:n.label,
   body:`You went <b>${fmt(n.v-n.limit,n.unit)}</b> over your limit today. It cannot be undone, but I can show you what pushed it there.`,
   cta:'See what caused it'}),
 tooHigh:n=>({tag:STATE_LABEL.tooHigh,title:n.label,
   body:`You went <b>${fmt(n.v-n.limit,n.unit)}</b> over your limit today. It cannot be undone, but I can show you what pushed it there.`,
   cta:'See what caused it'}),
 tooLow:n=>({tag:STATE_LABEL.tooLow,title:n.label,
   body:`You are <b>${fmt(n.limit-n.v,n.unit)}</b> short of your target for today. Would ${n.pair} work to close it?`,
   cta:'See how to fix it'}),
 low:n=>({tag:STATE_LABEL.low,title:n.label,
   body:`You are <b>${fmt(n.limit-n.v,n.unit)}</b> away from your target. Would ${n.pair} do it?`,
   cta:'See how to fix it'}),
 onTrack:n=>({tag:STATE_LABEL.onTrack,title:n.label,
   body:n.type==='A'
     ? `You are back under your daily limit, now at <b>${fmt(n.v,n.unit)}</b> of ${fmt(n.limit,n.unit)}.`
     : `You reached your target for today, now at <b>${fmt(n.v,n.unit)}</b> of ${fmt(n.limit,n.unit)}.`,
   cta:null})   // nothing left to do, so no button
};

const TOP_ITEMS={

 addedSugar:[['Granola bar','22 g'],['Flavored yogurt','14 g'],['Iced coffee','11 g']],
 satFat:[['Cheddar cheese','9 g'],['Butter on toast','6 g'],['Beef patty','5 g']],
 transFat:[['Croissant','0,8 g'],['Packaged cookies','0,5 g']]
};
const ADD_FOODS={
 protein:[['Greek yogurt','1 cup',18],['Two eggs','2 units',12],['Chicken breast','150 g',31]],
 fiber:[['Cooked lentils','1 cup',15],['Pear with skin','1 unit',6],['Oats','½ cup',8]]
};
function longMessage(n){
  const s=stateOf(n);
  if(s==='preventive') return `There is still room under your ${n.label.toLowerCase()} ceiling, but it goes faster than people expect. Packaged foods and anything with a sauce carry most of it. Keep whatever you eat next simple and you will land under it comfortably.`;
  if(s==='high'||s==='tooHigh') return `${n.label} went past its ceiling for today. That part is done and there is no way to walk it back, so the useful thing is knowing where it came from and keeping it from climbing further. Here is what contributed most:`;
  if(s==='tooLow'||s==='low') return `${n.label} is short of your target and it will not close on its own. It moves fast though: one solid portion covers most of the gap. Add one of these straight to your next meal.`;
  return `${n.label} is settled for today. Nothing to do here, and your log already reflects it.`;
}

/* ---------------- evaluation cycle (§1: on return to the Plan tab) ---------------- */
function evaluate(){
  const q=N.filter(qualifies).sort((a,b)=>a.rank-b.rank);
  const pick=q.find(n=>(dayState.sentTodayByNutrient[n.key]||0)<CAPS.maxPerNutrientPerDay
                    && dayState.totalSentToday<CAPS.maxAlertsPerDay);
  if(!pick){ toast(q.length?'Qualified, but caps blocked it.':'Nothing qualifies right now.'); render(); return; }
  dayState.sentTodayByNutrient[pick.key]=(dayState.sentTodayByNutrient[pick.key]||0)+1;
  dayState.totalSentToday+=1;
  const isNew=!dayState.triggeredToday[pick.key];
  dayState.triggeredToday[pick.key]=true;
  if(tab!=='coach') unseen=true;          // badge on the Coach tab until it is opened
  render();
  const c=document.querySelector(`.card[data-id="${pick.key}"]`);
  if(c) c.classList.add('flash');
  toast(isNew?`Alert sent: ${pick.label}. Its card is now pinned here.`
             :`Second alert for ${pick.label}. Same card, updated.`);
}

/* ---------------- render ---------------- */
const body=document.getElementById('body'), sugg=document.getElementById('sugg');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

let firstEver=false;

const nothingLogged=()=>cal===0 && N.every(n=>n.v===0);
const pinned=()=>N.filter(n=>dayState.triggeredToday[n.key])
  // resolved before the user ever saw it open: there is no story to tell
  .filter(n=>stateOf(n)!=='onTrack' || dayState.seenToday[n.key])
  .sort((a,b)=>{const o={tooHigh:0,tooLow:0,high:1,low:1,preventive:2,onTrack:3};
    return (o[stateOf(a)]-o[stateOf(b)])||(a.rank-b.rank);});

/* Everything that is not back on target counts as something to check, over-limit
   alerts included. They only change the headline when they are all that is left,
   because at that point there is nothing to act on. */
const isOpen=n=>stateOf(n)!=='onTrack';
const isOver=n=>['high','tooHigh'].includes(stateOf(n));

/* opening Coach counts as seeing whatever is currently open */
function markSeen(list){ list.forEach(n=>{ if(stateOf(n)!=='onTrack') dayState.seenToday[n.key]=true; }); }

function titleFor(){
  const p=pinned(), open=p.filter(isOpen), n=open.length;
  if(!p.length) return {lbl:'Today',h1:'Nothing to fix today',
    sub:"Everything you've logged so far is inside your targets."};
  if(n===0) return {lbl:"Today's alerts",h1:`You closed all ${p.length}`,
    sub:'Everything I flagged today is back inside your targets.'};
  // only over-limit left: nothing to act on, so name what happened instead
  if(open.every(isOver)) return {lbl:"Today's alerts",
    h1:`${n} thing${n>1?'s':''} went over today`,
    sub:'Nothing to change now, but worth seeing what caused it.'};
  return {lbl:"Today's alerts",h1:`${n} thing${n>1?'s':''} to check`,sub:''};
}

function card(n){
  const st=stateOf(n), c=COPY[st](n);
  const src=ICON3D[n.key]||ICON3D.sodium;
  const node=el(`<div class="card s-${st}" data-id="${n.key}">
    <div class="cin">
      <div class="crow">
        <div class="cic"><img src="${src}" width="24" height="24" alt=""></div>
        <div class="ct">${c.title}</div>
        ${c.tag?`<span class="tag ${st}">${c.tag}</span>`:''}
      </div>
      <div class="cbody"><div class="cb">${c.body}</div></div>
    </div>
    <div class="ctarow">${c.cta
      ? `<button class="cta">${c.cta}</button>`
      : `<div class="cdone"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l3.5 3.5L14 5"/></svg>Completed</div>`}</div>
  </div>`);
  const btn=node.querySelector('.cta');
  if(btn) btn.onclick=()=>openChat(n.key);
  return node;
}

function render(){
  paintPanel();
  const planEl=document.getElementById('plan');
  const footEl=document.querySelector('.footer');
  const ttlEl=document.querySelector('.hdr .ttl');
  if(planEl){
    planEl.hidden = tab!=='plan';
    body.style.display = tab==='plan' ? 'none' : '';
    if(footEl) footEl.style.display = tab==='plan' ? 'none' : '';
    if(ttlEl) ttlEl.textContent = tab==='plan' ? 'Plan' : 'Fitia Coach';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='plan'&&tab==='plan'));
    const solo=document.querySelector('.tabsolo');
    solo.classList.toggle('on',tab==='coach');
    solo.classList.toggle('badge',unseen && tab!=='coach');
    if(tab==='plan') return;
  }
  const nb=document.getElementById('newBtn');
  if(nb) nb.style.visibility = nothingLogged() ? 'hidden' : 'visible';
  if(view==='chat'){ return; }
  body.className='body';
  const t=titleFor(), p=pinned();

  // nothing logged, or logged with no alerts → same layout, different words
  document.querySelector('.phone').classList.add('plain');   // no aura without alerts
  if(nothingLogged() || !p.length){
    const blank=nothingLogged();
    const h  = blank ? (firstEver ? "Hello, I'm Coach" : `${greeting()}, ${USER}`)
                     : 'Nothing to fix today';
    const sb = blank ? (firstEver ? "I'll answer anything about your nutrition." : '')
                     : "Everything you've logged is inside your targets.";
    // scope label depends on whether anything has been logged yet
    const acts = blank
      ? [['eat',"Plan today's meals"],['recipe','Create a recipe'],['scan','Scan my food']]
      : [['day','How is my day going?'],['meal',`How was my ${lastMeal}?`]];
    body.innerHTML=`<div class="head-block"><div class="ai">${AI_MARK}</div>
        <div class="ttlgrp"><div class="h1">${h}</div>
        ${sb?`<div class="sub">${sb}</div>`:''}</div></div>
      <div class="pills">${acts.map(([k,t])=>
        `<button class="pill" data-act="${k}">${PILL_ICON[k]}${t}</button>`).join('')}</div>
`;
    body.querySelectorAll('.pill').forEach(b=>{
      const k=b.dataset.act;
      b.onclick=()=>toast(PILL_DESC[ k==='eat' && !blank ? 'rest' : k ]);
    });
    sugg.innerHTML='';
    return;
  }

  body.innerHTML=`<div class="head-block"><div class="ai">${AI_MARK}</div>
      <div class="ttlgrp"><div class="lbl">${t.lbl}</div><div class="h1">${t.h1}</div>
      ${t.sub?`<div class="sub">${t.sub}</div>`:''}</div></div><div id="content"></div>`;
  const content=document.getElementById('content');

  {
      document.querySelector('.phone').classList.remove('plain');
    markSeen(p);
    const rail=el(`<div class="rail" role="group" aria-label="Today's alerts"></div>`);
    p.forEach(n=>rail.appendChild(card(n)));
    content.appendChild(rail);
    const dots=el(`<div class="dots">${p.length>1?p.map((n,i)=>
      `<button class="dot ${i===0?'on':''}" aria-label="Alert ${i+1} of ${p.length}"></button>`).join(''):''}</div>`);
    content.appendChild(dots);
    wireRail(rail,dots,p.length);
  }
  sugg.innerHTML='';   // insight mode shows no suggestion chips
}

function wireRail(rail,dots,count){
  const step=()=>{const c=rail.querySelector('.card');if(!c)return 337;
    return c.getBoundingClientRect().width+(parseFloat(getComputedStyle(rail).gap)||16);};
  const idx=()=>Math.max(0,Math.min(count-1,Math.round(rail.scrollLeft/step())));
  rail.addEventListener('scroll',()=>{const i=idx();
    dots.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i));},{passive:true});
  dots.querySelectorAll('.dot').forEach((d,i)=>d.onclick=()=>rail.scrollTo({left:i*step(),behavior:'smooth'}));
  // Drag must not swallow clicks on the cards: only capture the pointer once
  // the gesture is clearly a drag, never on pointerdown.
  let armed=false,dragging=false,sx=0,ss=0,pid=null;
  rail.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    armed=true; dragging=false; sx=e.clientX; ss=rail.scrollLeft; pid=e.pointerId;
  });
  rail.addEventListener('pointermove',e=>{
    if(!armed) return;
    const dx=e.clientX-sx;
    if(!dragging){
      if(Math.abs(dx)<5) return;              // still a click, leave it alone
      dragging=true; rail.classList.add('dragging');
      try{ rail.setPointerCapture(pid); }catch(_){}
    }
    rail.scrollLeft=ss-dx;
  });
  const end=()=>{
    armed=false;
    if(!dragging) return;                      // plain click: nothing to snap
    dragging=false; rail.classList.remove('dragging');
    rail.scrollTo({left:idx()*step(),behavior:'smooth'});
  };
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>rail.addEventListener(ev,end));
}

/* ---- chat: full loop from the card ---- */
function bubbleCoach(html){
  return el(`<div class="bubble enter" style="max-width:100%">
    <div class="bmeta"><div class="av"><svg width="14" height="14" viewBox="0 0 34 34" fill="none">
      <path d="M17 4l2.6 7.4L27 14l-7.4 2.6L17 24l-2.6-7.4L7 14l7.4-2.6z" fill="#fff"/></svg></div>
      <div class="nm">Coach</div></div><div class="bt">${html}</div></div>`);
}
function chatChips(items){
  sugg.innerHTML='';
  items.forEach(([txt,fn])=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;sugg.appendChild(b);});
}
function openChat(k){
  if(view==='chat') return;
  view='chat'; chatKey=k;
  const n=byKey[k], st=stateOf(n), c=COPY[st](n);
  document.querySelector('.phone').classList.add('plain');   // aura fades out for the conversation
  const card=document.querySelector(`.card[data-id="${k}"]`);

  // everything that is not this card folds away; the card rises with the flow
  document.querySelectorAll('.spark,.lbl,.h1,.sub,.dots').forEach(e=>e.classList.add('fold'));
  document.querySelectorAll('.card').forEach(el2=>{ if(el2!==card) el2.classList.add('leaving'); });
  if(card){
    card.classList.add('tochat');
    const rail=card.closest('.rail');
    if(rail){ rail.style.overflow='hidden'; rail.scrollTo({left:0}); }
  }

  setTimeout(()=>{
    body.className='body chat';
    body.innerHTML='';
    // the same card, now the header of the conversation
    body.appendChild(el(`<div class="ctxcard s-${st}"><div class="cin">
      <div class="crow">
        <div class="cic"><img src="${ICON3D[n.key]||ICON3D.sodium}" width="24" height="24" alt=""></div>
        <div class="ct" style="font-size:15px">${c.title}</div>
        ${c.tag?`<span class="tag ${st}">${c.tag}</span>`:''}
      </div>
      <div class="cb" style="margin-top:7px;font-size:14px">${c.body}</div>
    </div></div>`));
    body.appendChild(el(`<div class="bubble me enter"><div class="bt">${c.cta}</div></div>`));
    const t=el(`<div class="bubble enter"><div class="typing"><i></i><i></i><i></i></div></div>`);
    body.appendChild(t);
    chatChips([]);

    setTimeout(()=>{
      t.remove();
      const b=bubbleCoach(longMessage(n));

      if(st==='high'||st==='tooHigh'){
        (TOP_ITEMS[n.key]||[]).forEach(([name,amt])=>
          b.appendChild(el(`<div class="food"><div><div class="fn">${name}</div>
            <div class="fv">${amt} of ${n.label.toLowerCase()}</div></div></div>`)));
        body.appendChild(b);
        body.appendChild(bubbleCoach('For the rest of today, cooking from scratch keeps it from climbing. Nothing you eat now lowers what is already logged.'));
        chatChips([]);   // no suggestions inside a conversation
      }
      else if(st==='tooLow'||st==='low'){
        (ADD_FOODS[n.key]||[]).forEach(([name,portion,amount])=>{
          const row=el(`<div class="food"><div><div class="fn">${name}</div>
            <div class="fv">${portion} · +${amount}${n.unit}</div></div>
            <button class="fadd">Add</button></div>`);
          row.querySelector('.fadd').onclick=e=>{
            n.v=Math.min(n.max,n.v+amount);
            const sl=document.querySelector(`#sliders input[data-k="${n.key}"]`); if(sl) sl.value=n.v;
            e.target.textContent='Added ✓'; e.target.classList.add('added'); e.target.disabled=true;
            paintPanel();
            body.appendChild(bubbleCoach(stateOf(n)==='onTrack'
              ? `That closes it. ${n.label} is on track for today.`
              : `Logged. ${n.label} is at ${fmt(n.v,n.unit)} now, ${fmt(n.limit-n.v,n.unit)} to go.`));
            body.scrollTop=body.scrollHeight;
            chatChips([]);
          };
          b.appendChild(row);
        });
        body.appendChild(b);
        chatChips([]);
      }
      else{
        body.appendChild(b);
        chatChips([]);
      }
      body.scrollTop=body.scrollHeight;
    },900);
  },320);
}

/* ---------------- panel ---------------- */
const STATE_COLOR={high:['#fdf3e3','#BB6B02'],tooHigh:['#fbeceb','#c0392b'],
  tooLow:['#fbeceb','#c0392b'],low:['#fdf3e3','#BB6B02'],onTrack:['#eaf6ee','#2f9e57'],
  preventive:['#fdf3e3','#BB6B02']};

let liveT=null;
function liveEvaluate(){
  clearTimeout(liveT);
  liveT=setTimeout(()=>{ evaluate(); paintPanel(); },250);
}

function buildSliders(){
  const box=document.getElementById('sliders'); box.innerHTML='';
  N.forEach(n=>{
    const w=el(`<div class="slid">
      <div class="sl-top"><span class="sl-name">${n.label}</span>
        <span class="sl-state" data-state="${n.key}"></span>
        <span class="sl-val" data-val="${n.key}"></span></div>
      <input type="range" min="0" max="${n.max}" step="${n.step}" value="${n.v}" data-k="${n.key}"></div>`);
    const inp=w.querySelector('input');
    inp.addEventListener('input',e=>{
      n.v=parseFloat(e.target.value);
      if(tab==='plan') paintPanel(); else render();
    });
    // evaluate as soon as the slider settles, without leaving the tab
    inp.addEventListener('change',()=>{ if(tab==='plan') liveEvaluate(); });
    box.appendChild(w);
  });
  const c=document.getElementById('cal');
  c.value=cal;
  c.addEventListener('input',e=>{cal=parseInt(e.target.value); if(tab==='plan') paintPanel(); else render();});
  c.addEventListener('change',()=>{ if(tab==='plan') liveEvaluate(); });
}

function paintPanel(){
  document.getElementById('vcal').textContent=`${cal.toLocaleString('en-US')} / ${CAL_TARGET.toLocaleString('en-US')} kcal`;
  document.getElementById('kSent').textContent=`${dayState.totalSentToday} / ${CAPS.maxAlertsPerDay}`;
  N.forEach(n=>{
    const v=document.querySelector(`[data-val="${n.key}"]`), s=document.querySelector(`[data-state="${n.key}"]`);
    if(!v) return;
    v.textContent=`${fmt(n.v,n.unit)} / ${fmt(n.limit,n.unit)} · ${(ratio(n)*100).toFixed(0)}%`;
    if(dayState.triggeredToday[n.key]){
      const st=stateOf(n), [bg,fg]=STATE_COLOR[st];
      s.textContent=COPY[st](n).tag||'Preventive'; s.style.background=bg; s.style.color=fg;
    } else if(qualifies(n)){
      s.textContent='qualifies'; s.style.background='#eaf6ee'; s.style.color='#2f9e57';
    } else {
      // its own condition is met but a calorie gate is holding it back
      const ownCondition = n.type==='A'
        ? ratio(n)>=CONFIG.typeAThreshold
        : (calRatio()>.05 ? ratio(n)/Math.min(calRatio(),1) : 1) < CONFIG.typeBProjectionThreshold;
      let why='';
      if(ownCondition){
        if(n.type==='A' && calRatio()>=CONFIG.typeACalCeiling) why='blocked: calories over target';
        else if(n.type==='B' && calRatio()<CONFIG.typeBMinCalRatio) why='blocked: needs 50% of calories';
        else if(n.type==='B' && calRoom()<CONFIG.typeBMinCalRoom) why='blocked: under 150 kcal of room';
      }
      s.textContent=why; s.style.background=why?'#fbeceb':'transparent'; s.style.color=why?'#c0392b':'transparent';
    }
  });
  const g=document.getElementById('gates');
  const rows=[
    ['Limit alerts (sodium, sugar, sat fat, trans fat)',
     calRatio()<CONFIG.typeACalCeiling,
     calRatio()<CONFIG.typeACalCeiling ? 'open · calories under target'
       : `blocked · calories at ${(calRatio()*100).toFixed(0)}% of target`],
    ['Target alerts (protein, fiber) evaluated',
     calRatio()>=CONFIG.typeBMinCalRatio,
     calRatio()>=CONFIG.typeBMinCalRatio ? 'open · half the day logged'
       : `blocked · only ${(calRatio()*100).toFixed(0)}% of calories logged, needs 50%`],
    ['Room left to act on advice',
     calRoom()>=CONFIG.typeBMinCalRoom,
     calRoom()>=CONFIG.typeBMinCalRoom ? `open · ${calRoom()} kcal to the top of the range`
       : `blocked · only ${Math.max(0,calRoom())} kcal left, needs 150`]
  ];
  g.innerHTML=rows.map(([label,ok,note])=>
    `<div class="gate ${ok?'ok':'no'}"><i></i><div><b>${label}</b><span>${note}</span></div></div>`).join('');

  const q=N.filter(qualifies).map(n=>n.label);
  const lg=document.getElementById('legend');
  const blockers=[];
  if(dayState.totalSentToday>=CAPS.maxAlertsPerDay) blockers.push('daily cap of 5 alerts reached.');
  lg.innerHTML = (q.length
      ? `<b>Qualifying now:</b> ${q.join(', ')}. Press “Return to Plan tab” — only the highest priority one sends.`
      : '<b>Nothing qualifies right now.</b>')
    + (blockers.length?`<br><br><b>Blocked by:</b> ${blockers.join(' ')}`:'');
}

document.getElementById('delBtn').onclick=()=>{
  dayState.sentTodayByNutrient={};      // §4.1: deletion clears per-nutrient caps
  toast('Food deleted. Per-nutrient caps cleared, cards stay.');
  render();
};
document.getElementById('resetBtn').onclick=()=>{
  dayState={triggeredToday:{},seenToday:{},sentTodayByNutrient:{},totalSentToday:0};
  cal=0; unseen=false; N.forEach(n=>n.v=0);
  document.getElementById('cal').value=0;
  document.querySelectorAll('#sliders input[type=range]').forEach(i=>i.value=0);
  view='home'; toast('New day. Nothing logged yet.'); render();
};

/* drag-to-scroll for any horizontal strip, click-safe (5px threshold) */
function dragScroll(elm){
  let armed=false,dragging=false,sx=0,ss=0,pid=null;
  elm.style.cursor='grab';
  elm.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    armed=true; dragging=false; sx=e.clientX; ss=elm.scrollLeft; pid=e.pointerId;
  });
  elm.addEventListener('pointermove',e=>{
    if(!armed) return;
    const dx=e.clientX-sx;
    if(!dragging){
      if(Math.abs(dx)<5) return;
      dragging=true; elm.style.cursor='grabbing';
      try{ elm.setPointerCapture(pid); }catch(_){}
    }
    elm.scrollLeft=ss-dx;
  });
  const stop=()=>{armed=false;dragging=false;elm.style.cursor='grab';};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>elm.addEventListener(ev,stop));
  elm.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;   // trackpad already horizontal
    e.preventDefault(); elm.scrollLeft+=e.deltaY;
  },{passive:false});
}
dragScroll(sugg);

function goTab(t){
  if(t===tab) return;
  tab=t;
  if(t==='plan'){ evaluate(); render(); }   // §1: the day is evaluated on return to the Plan tab
  else { unseen=false; view='home'; render(); }
}
document.querySelectorAll('.tab').forEach(el2=>{
  el2.style.cursor='pointer';
  el2.onclick=()=>{ if(el2.dataset.tab==='plan') goTab('plan'); };
});
document.querySelector('.tabsolo').style.cursor='pointer';
document.querySelector('.tabsolo').onclick=()=>goTab('coach');

document.getElementById('newBtn').onclick=()=>{
  view='home'; render(); toast('New chat. Your alerts are here.');
};
document.getElementById('menuBtn').onclick=()=>toast('Opens chat history.');

buildSliders();
dayState.triggeredToday={sodium:true,protein:true,fiber:true};
dayState.sentTodayByNutrient={sodium:1,protein:1,fiber:1};
dayState.totalSentToday=3;
render();

</script>
