<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Fitia Coach · alert home</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>


<div class="colA" style="margin:0 auto">
<div class="lead">The card is not the notification. It renders from current totals every time you open Coach.</div>
<div class="phone">
  <div class="aura"></div>

  <div class="status">
    <span class="t">9:41</span>
    <span class="r">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.2C5.3 2.2 2.9 3.3 1.1 5l1.3 1.3C3.9 4.9 5.8 4 8 4s4.1.9 5.6 2.3L15 5C13.1 3.3 10.7 2.2 8 2.2z"/><circle cx="8" cy="8.9" r="1.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23 4v4c.8-.3 1.3-1 1.3-2S23.8 4.3 23 4z" fill="currentColor" fill-opacity=".35"/></svg>
    </span>
  </div>

  <div class="hdr">
    <button class="gbtn" id="menuBtn" aria-label="Open history">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1h12M1 6h12M1 11h8"/></svg></button>
    <div class="ttl">Fitia Coach</div>
    <button class="gbtn" id="newBtn" aria-label="New chat">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.1 1.9a1.7 1.7 0 012.4 2.4L6.6 13.2l-3.2.8.8-3.2z"/><path d="M11.6 3.4l2.4 2.4"/></svg></button>
  </div>

  <div class="body" id="body"></div>
  <div class="planview" id="plan" hidden>
    <div class="pv-scroll">
      <div class="pv-h1">Today</div>
      <div class="kpi"><div><div class="kn">Alerts sent today</div><div class="kv" id="kSent"></div></div></div>
      <div class="sec">Calories logged · gates every alert</div>
      <div class="slid">
        <div class="sl-top"><span class="sl-name">Calories</span><span class="sl-val" id="vcal"></span></div>
        <input type="range" id="cal" min="0" max="2400" step="25">
        <div class="gates" id="gates"></div>
      </div>
      <div class="sec">Nutrients</div>
      <div id="sliders"></div>
      <div class="legend" id="legend"></div>
      <div class="band">
        <button id="delBtn">Delete a food</button>
        <button id="resetBtn">New day</button>
      </div>
    </div>
  </div>


  <div class="footer">
    <div class="sugg" id="sugg"></div>
    <div class="msginput">
      <div class="ph">Ask Fitia Coach</div>
      <div class="btns">
        <svg class="photo" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.3" y="4" width="17.4" height="14" rx="4"/><circle cx="11" cy="11" r="3.2"/></svg>
        <div class="send"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 12.5V3M3.5 7l4-4 4 4"/></svg></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tabgrp">
      <div class="tab" data-tab="plan"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="4" width="14" height="18" rx="3"/><path d="M9.5 9h7M9.5 13h7M9.5 17h4"/></svg><span>Plan</span></div>
      <div class="tab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11.5" cy="11.5" r="6.5"/><path d="M16.5 16.5l4.5 4.5"/></svg><span>Search</span></div>
      <div class="tab" data-tab="progress"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 19V12M13 19V6M19 19v-5"/></svg><span>Progress</span></div>
    </div>
    <div class="tabsolo on">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 3l1.9 4.9L18 9.8l-5.1 1.9L11 16.6l-1.9-4.9L4 9.8l5.1-1.9z"/></svg>
      <span>Coach</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</div>

</div>
<script src="./icons.js"></script>
<script src="./config.js"></script>
<script src="./copy.js"></script>
<script src="./engine.js"></script>
<script src="./view.js"></script>
<script src="./chat.js"></script>
<script src="./plan.js"></script>
</body>
</html>
